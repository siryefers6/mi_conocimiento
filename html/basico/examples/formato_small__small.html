<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto Pequeño - Small</title>
</head>
<body>
    <h1>Elemento Small</h1>
    
    <p>Este producto cuesta $99.99 <small>(impuestos no incluidos)</small></p>
    
    <p>Todos los derechos reservados &copy; 2024 <small>MiEmpresa Inc.</small></p>
    
    <p>Términos y condiciones <small>Versión 3.1, efectiva desde 2024</small></p>
    
    <!--
    Objetivo: usar correctamente el elemento small
    Referencia: <small>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <small> marca texto que tiene menos importancia
    - Por defecto, el navegador lo muestra más pequeño
    - Casos válidos:
      * Aclaraciones entre paréntesis
      * Información secundaria
      * Información legal/técnica
      * Comentarios menores
    - NO usar para disminuir el tamaño de fuente
    - <small> es semántico: indica menos importancia
    - Los lectores de pantalla lo pueden enfatizar diferente
    -->
</body>
</html>
