<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación - Placeholder</title>
</head>
<body>
    <h1>Atributo PLACEHOLDER</h1>
    
    <form>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" 
               placeholder="Ej: Juan Pérez García">
        <br><br>
        
        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" 
               placeholder="usuario@ejemplo.com">
        <br><br>
        
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" 
               placeholder="+34 912 345 678">
        <br><br>
        
        <label for="busqueda">Búsqueda:</label>
        <input type="search" id="busqueda" name="busqueda" 
               placeholder="Escribe para buscar...">
        <br><br>
        
        <label for="comentario">Comentario:</label>
        <textarea id="comentario" name="comentario" 
                  placeholder="Comparte tu opinión..."></textarea>
    </form>
    
    <!--
    Objetivo: mostrar texto de ayuda en campo vacío
    Referencia: placeholder
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - placeholder = texto de ejemplo/ayuda
    - Desaparece al escribir
    - NO es etiqueta (<label>)
    - SIEMPRE usar <label> también
    - Funciona en:
      * <input> (todos tipos)
      * <textarea>
    - Casos válidos:
      * Ejemplo de formato
      * Instrucción breve
      * Sugerencia de contenido
    - NO reemplaza <label>
    - Importante accesibilidad
    - Estilizable con CSS
    -->
</body>
</html>
