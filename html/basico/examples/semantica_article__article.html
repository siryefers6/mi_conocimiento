<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Article</title>
</head>
<body>
    <article>
        <h1>Introducción a HTML5</h1>
        <p>Por <strong>Juan Pérez</strong> el <time datetime="2024-01-15">15 de enero de 2024</time></p>
        
        <p>HTML5 es la última versión del lenguaje de marcado...</p>
        
        <section>
            <h2>Historia de HTML</h2>
            <p>HTML fue creado en 1989...</p>
        </section>
        
        <section>
            <h2>Características principales</h2>
            <ul>
                <li>Elementos semánticos</li>
                <li>Formularios mejorados</li>
                <li>APIs de multimedia</li>
            </ul>
        </section>
    </article>
    
    <article>
        <h1>Otro artículo</h1>
        <p>Contenido...</p>
    </article>
    
    <!--
    Objetivo: contenido independiente
    Referencia: <article>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <article> contenido independiente
    - Puede reutilizarse/redistributirse
    - Casos de uso:
      * Artículo de blog
      * Noticia
      * Comentario de usuario
      * Post en foro
    - Puede contener <section>
    - Múltiples <article> por página
    - Atributos: ninguno especial
    - Mejora semántica
    - SEO: identifica artículos
    - Accesibilidad mejorada
    -->
</body>
</html>
