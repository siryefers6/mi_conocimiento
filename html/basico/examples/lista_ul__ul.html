<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista No Ordenada - UL</title>
</head>
<body>
    <h1>Elemento UL (Lista No Ordenada)</h1>
    
    <h2>Requisitos del Sistema</h2>
    <ul>
        <li>Node.js 14 o superior</li>
        <li>npm 6 o superior</li>
        <li>Git</li>
        <li>Un editor de texto</li>
    </ul>
    
    <h2>Características</h2>
    <ul>
        <li>Rápido
            <ul>
                <li>Proceso compilado</li>
                <li>Optimizaciones integradas</li>
            </ul>
        </li>
        <li>Flexible</li>
        <li>Bien documentado</li>
    </ul>
    
    <!--
    Objetivo: usar ul para listas sin orden
    Referencia: <ul>, <li>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <ul> = unordered list (sin orden específico)
    - <li> = list item (elemento de lista)
    - Las viñetas son automáticas
    - Casos válidos:
      * Ingredientes de una receta
      * Características de un producto
      * Requisitos
      * Items de una lista de compras
    - Puede anidarse (listas dentro de listas)
    - Semánticamente: agrupa elementos relacionados
    - Los navegadores agregan viñetas automáticamente
    -->
</body>
</html>
