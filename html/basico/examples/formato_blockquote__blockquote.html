<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita de Bloque - Blockquote</title>
</head>
<body>
    <h1>Elemento BLOCKQUOTE</h1>
    
    <blockquote>
        <p>La verdadera inteligencia es la capacidad de aprender y adaptarse. Aquellos que pueden cambiar de opinión cuando se enfrentan a nuevos hechos son los verdaderos pensadores.</p>
        <p>— Albert Einstein</p>
    </blockquote>
    
    <p>Esta cita se presenta como una cita de bloque porque ocupa múltiples párrafos.</p>
    
    <!--
    Objetivo: usar blockquote para citas largas
    Referencia: <blockquote>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <blockquote> marca una cita extensa
    - Es un elemento de bloque (ocupa línea completa)
    - Útil para citas que abarcan párrafos
    - Por defecto, los navegadores lo indentan
    - Casos válidos:
      * Citas literarias largas
      * Testimonios
      * Extractos de documentos
    - Combina bien con <p> para estructura
    - <cite> para atribuir la fuente
    - Diferencia con <q> (cita corta inline)
    -->
</body>
</html>
