<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Section</title>
</head>
<body>
    <article>
        <h1>Historia del Café</h1>
        
        <section>
            <h2>Orígenes</h2>
            <p>El café se originó en Etiopía hace miles de años...</p>
        </section>
        
        <section>
            <h2>Propagación por el mundo</h2>
            <p>En el siglo XVI, el café llegó a la región árabe...</p>
        </section>
        
        <section>
            <h2>Era moderna</h2>
            <p>Hoy en día, el café es la bebida más consumida...</p>
        </section>
        
        <section>
            <h2>Variedades</h2>
            <ul>
                <li>Arábica</li>
                <li>Robusta</li>
                <li>Liberica</li>
            </ul>
        </section>
    </article>
    
    <!--
    Objetivo: agrupar contenido temático
    Referencia: <section>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <section> agrupa contenido temático
    - Típicamente con un <h2> o más
    - NO es genérico como <div>
    - Diferencia <article>:
      * <article> independiente
      * <section> parte de algo mayor
    - Casos de uso:
      * Capítulos de libro
      * Pestañas/secciones
      * Divisiones temáticas
      * Apartados de artículo
    - Debe tener encabezado
    - Mejora semántica y SEO
    - Accesibilidad mejorada
    -->
</body>
</html>
