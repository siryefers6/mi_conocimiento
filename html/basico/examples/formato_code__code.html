<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Inline - Code</title>
</head>
<body>
    <h1>Elemento CODE (Código Inline)</h1>
    
    <p>Para imprimir en consola, usa <code>console.log()</code></p>
    
    <p>El atributo <code>href</code> especifica el destino del enlace.</p>
    
    <p>Puedes usar variables como <code>variableNombre</code> en JavaScript.</p>
    
    <p>La función <code>Array.map()</code> transforma cada elemento.</p>
    
    <!--
    Objetivo: usar code para código inline
    Referencia: <code>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <code> marca código dentro de un párrafo
    - Por defecto usa fuente monoespaciada
    - Para código de múltiples líneas, usa <pre> o <code><pre>
    - Casos válidos:
      * Nombres de funciones
      * Nombres de variables
      * Comandos cortos
      * Fragmentos de código
    - Es semántico: lectores de pantalla lo reconocen
    - NO cambiar el tipo de fuente manualmente
    - Los buscadores entienden que es código
    -->
</body>
</html>
