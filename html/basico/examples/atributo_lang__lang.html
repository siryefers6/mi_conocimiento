<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributo Lang</title>
</head>
<body>
    <h1 lang="es">Hola, esto es español</h1>
    
    <p lang="en">Hello, this is English</p>
    
    <p>Este párrafo hereda el idioma de la página (español)</p>
    
    <blockquote lang="fr">
        "Bonjour, ceci est du français"
    </blockquote>
    
    <p><span lang="de">Guten Tag, das ist Deutsch</span></p>
    
    <!--
    Objetivo: especificar idioma del contenido
    Referencia: lang
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - lang = idioma del contenido
    - Formato ISO 639-1: es, en, fr, de, etc.
    - Formato completo: es-ES, en-US, etc.
    - Casos de uso:
      * Especificar idioma página
      * Secciones multiidioma
      * Citas en otros idiomas
    - Usado por:
      * Navegadores (corrector ortográfico)
      * Lectores de pantalla
      * Motores búsqueda (SEO)
      * Herramientas de traducción
    - Hereda de padre a hijo
    - Atributo global
    - Códigos comunes:
      * es = español
      * en = inglés
      * fr = francés
      * de = alemán
      * it = italiano
      * ja = japonés
    -->
</body>
</html>
