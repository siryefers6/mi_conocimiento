<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énfasis - EM</title>
</head>
<body>
    <h1>Elemento EM</h1>
    
    <p>Este es <em>texto enfatizado</em> que requiere entonación especial.</p>
    
    <p><em>Por favor</em> lee las instrucciones cuidadosamente.</p>
    
    <p>El elemento em es <em>preferible a &lt;i&gt;</em> para énfasis semántico.</p>
    
    <p>Diferencia: <strong>importante</strong> vs <em>énfasis</em></p>
    
    <!--
    Objetivo: entender el uso semántico de em
    Referencia: <em>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <em> marca texto enfatizado (not stressed importance)
    - Por defecto, el navegador lo muestra en cursiva
    - Es mejor que <i> porque tiene significado semántico
    - Importante para accesibilidad y lectores de pantalla
    - Em = énfasis (cambiar la entonación al leer)
    - Strong = importancia (contenido crítico)
    - Ambos son semánticos
    -->
</body>
</html>
