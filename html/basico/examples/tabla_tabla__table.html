<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Básica</title>
</head>
<body>
    <h1>Elemento TABLE</h1>
    
    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Ocupación</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>28</td>
            <td>Desarrollador</td>
        </tr>
        <tr>
            <td>María</td>
            <td>32</td>
            <td>Diseñadora</td>
        </tr>
    </table>
    
    <!--
    Objetivo: crear tabla básica
    Referencia: <table>, <tr>, <th>, <td>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <table> contenedor de datos tabulares
    - <tr> = table row (fila)
    - <th> = table header (encabezado)
    - <td> = table data (celda de datos)
    - Estructura básica:
      * <table>
        - <tr> (fila 1)
          * <th> (encabezado)
        - <tr> (fila 2)
          * <td> (dato)
    - NO usar tablas para diseño
    - Semántica para datos tabulares
    -->
</body>
</html>
