<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensiones de Imagen</title>
</head>
<body>
    <h1>Atributos Width y Height</h1>
    
    <h2>Imagen con ancho específico</h2>
    <img src="imagen.jpg" alt="Imagen" width="300">
    
    <h2>Imagen con alto específico</h2>
    <img src="imagen.jpg" alt="Imagen" height="200">
    
    <h2>Imagen con ambas dimensiones</h2>
    <img src="imagen.jpg" alt="Imagen" width="400" height="300">
    
    <!--
    Objetivo: controlar dimensiones de imagen
    Referencia: width, height
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - width: ancho en píxeles
    - height: alto en píxeles
    - Si especificas ambos, se mantiene la proporción
    - Si especificas uno, se calcula automáticamente
    - Casos válidos:
      * Imágenes responsivas
      * Thumbnails
      * Thumbnails en galerías
    - Mejor: usar CSS para responsive
    - Los atributos ayudan a reservar espacio
    - Mejora el performance (evita reflow)
    -->
</body>
</html>
