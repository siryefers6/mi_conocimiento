<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption en Tabla</title>
</head>
<body>
    <h1>Elemento CAPTION</h1>
    
    <table border="1">
        <caption>Tabla 1: Ventas Mensuales por Región (2024)</caption>
        <thead>
            <tr>
                <th>Mes</th>
                <th>Región A</th>
                <th>Región B</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Enero</td>
                <td>$50,000</td>
                <td>$45,000</td>
            </tr>
            <tr>
                <td>Febrero</td>
                <td>$55,000</td>
                <td>$48,000</td>
            </tr>
        </tbody>
    </table>
    
    <!--
    Objetivo: agregar título/descripción a tabla
    Referencia: <caption>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <caption> va DENTRO de <table>, primero
    - Proporciona título/descripción
    - Por defecto, aparece encima de la tabla
    - Casos válidos:
      * Título descriptivo
      * Número de tabla (Tabla 1:)
      * Periodo de datos
    - Importante para accesibilidad
    - SEO: describe el contenido de tabla
    - Mejora comprensión del usuario
    -->
</body>
</html>
