<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Password</title>
</head>
<body>
    <h1>Input type="password"</h1>
    
    <form>
        <label for="pwd">Contraseña:</label>
        <input type="password" id="pwd" name="password" minlength="8">
        <br><br>
        
        <label for="confirm">Confirmar contraseña:</label>
        <input type="password" id="confirm" name="confirm">
    </form>
    
    <!--
    Objetivo: entrada de contraseña (texto oculto)
    Referencia: <input type="password">
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - type="password" enmasca caracteres
    - Mostrado como viñetas o asteriscos
    - Datos enviados sin encriptación
    - SIEMPRE usar HTTPS en producción
    - Atributos útiles:
      * minlength = longitud mínima
      * maxlength = longitud máxima
      * pattern = complejidad requerida
      * autocomplete="current-password"
    - Validación HTML5 disponible
    - No es seguridad, solo ocultamiento visual
    -->
</body>
</html>
