<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Énfasis Fuerte - Strong</title>
</head>
<body>
    <h1>Elemento Strong</h1>
    
    <p>Este es <strong>texto importante</strong> que debe destacarse semánticamente.</p>
    
    <p><strong>ADVERTENCIA:</strong> Este valor no se puede cambiar después.</p>
    
    <p>El elemento strong es <strong>preferible a &lt;b&gt;</strong> para importancia semántica.</p>
    
    <!--
    Objetivo: entender el uso semántico de strong
    Referencia: <strong>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <strong> marca texto de IMPORTANCIA semántica
    - Por defecto, el navegador lo muestra en negrita
    - Es mejor que <b> porque tiene significado
    - Lectores de pantalla pueden enfatizar <strong>
    - Importante para SEO
    - Usa <strong> cuando el contenido es verdaderamente importante
    - NO uses para estilizar (usa CSS <b> si es solo presentación)
    -->
</body>
</html>
