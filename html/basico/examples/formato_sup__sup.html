<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superíndice - Sup</title>
</head>
<body>
    <h1>Elemento SUP (Superíndice)</h1>
    
    <p>E = mc<sup>2</sup> (ecuación de Einstein)</p>
    
    <p>2<sup>8</sup> = 256</p>
    
    <p>Producto registrado®<sup>TM</sup></p>
    
    <p>Primera nota de pie<sup>1</sup></p>
    
    <!--
    Objetivo: usar superíndice correctamente
    Referencia: <sup>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <sup> desplaza el texto hacia arriba (superíndice)
    - Por defecto también lo hace más pequeño
    - Casos válidos:
      * Exponentes: 2<sup>3</sup> = 8
      * Marcas: ®, ™, ©
      * Notas al pie: <sup>1</sup>
      * Números ordinales: 1<sup>ro</sup>
    - Es semántico: el lector de pantalla sabe que es superíndice
    - NO usar simplemente para cambiar tamaño
    - Complemento: <sub> para subíndice
    -->
</body>
</html>
