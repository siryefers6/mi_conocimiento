<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Aside</title>
</head>
<body>
    <header>
        <h1>Blog de Viajes</h1>
    </header>
    
    <main>
        <article>
            <h2>Mi viaje a Japón</h2>
            <p>El año pasado viajé a Japón por primera vez...</p>
            
            <p>Visité Tokyo, Kyoto y Osaka durante dos semanas...</p>
        </article>
    </main>
    
    <aside>
        <h3>Posts Relacionados</h3>
        <ul>
            <li><a href="#">Guía de Tokio</a></li>
            <li><a href="#">Hoteles en Japón</a></li>
            <li><a href="#">Comida Japonesa</a></li>
        </ul>
        
        <h3>Sobre el autor</h3>
        <p>Viajero apasionado por las culturas asiáticas...</p>
    </aside>
    
    <footer>
        <p>&copy; 2024</p>
    </footer>
    
    <!--
    Objetivo: contenido relacionado/secundario
    Referencia: <aside>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <aside> contenido tangencial
    - No es esencial al contenido principal
    - Casos de uso:
      * Barras laterales
      * Posts relacionados
      * Publicidad
      * Información del autor
      * Glosarios
    - Separado de <main>
    - Típicamente a un lado
    - Atributos: ninguno especial
    - Mejora semántica
    - SEO: identifica contenido secundario
    - Accesibilidad mejorada
    -->
</body>
</html>
