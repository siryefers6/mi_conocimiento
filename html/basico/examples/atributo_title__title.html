<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributo Title</title>
</head>
<body>
    <h1>Atributo TITLE</h1>
    
    <p title="Este es un texto de ayuda">Pasa el ratón sobre este párrafo</p>
    
    <a href="https://ejemplo.com" title="Ir a Ejemplo">Enlace con tooltip</a>
    <br><br>
    
    <button title="Haz clic para procesar">Botón con ayuda</button>
    <br><br>
    
    <img src="imagen.jpg" alt="Imagen" title="Leyenda de imagen">
    <br><br>
    
    <abbr title="HyperText Markup Language">HTML</abbr>
    
    <!--
    Objetivo: mostrar información auxiliar
    Referencia: title
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - title = tooltip al pasar ratón
    - Visible en navegadores de escritorio
    - Mobile muestra de forma diferente
    - Casos válidos:
      * Ayuda contextual
      * Explicación de abreviaturas
      * Información adicional
      * Descripciones de enlaces
    - Atributo global (funciona en cualquier elemento)
    - No afecta SEO
    - Complementa con aria-label para accesibilidad
    -->
</body>
</html>
