<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subíndice - Sub</title>
</head>
<body>
    <h1>Elemento SUB (Subíndice)</h1>
    
    <p>La fórmula del agua es H<sub>2</sub>O</p>
    
    <p>Aceleración se denota como a<sub>x</sub></p>
    
    <p>El registro del sistema está en /var/log/app<sub>1</sub>.log</p>
    
    <!--
    Objetivo: usar subíndice correctamente
    Referencia: <sub>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <sub> desplaza el texto hacia abajo (subíndice)
    - Por defecto también lo hace más pequeño
    - Casos válidos:
      * Fórmulas químicas: H<sub>2</sub>O
      * Ecuaciones matemáticas: x<sub>n</sub>
      * Referencias técnicas
    - Es semántico: el lector de pantalla sabe que es subíndice
    - NO usar simplemente para cambiar tamaño
    - Complemento: <sup> para superíndice
    -->
</body>
</html>
