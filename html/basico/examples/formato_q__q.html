<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita Corta - Q</title>
</head>
<body>
    <h1>Elemento Q (Quote)</h1>
    
    <p>Steve Jobs dijo: <q>Stay hungry, stay foolish</q></p>
    
    <p>La definición de inteligencia es <q>la capacidad de adaptarse</q>.</p>
    
    <p>El navegador automáticamente agrega comillas: <q>como estas</q></p>
    
    <!--
    Objetivo: usar q para citas cortas
    Referencia: <q>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <q> marca una cita corta inline
    - El navegador automáticamente agrega comillas
    - Para citas largas usa <blockquote>
    - Diferencia:
      * <q> = cita corta inline
      * <blockquote> = cita de bloque (párrafos)
    - Es semántico: indica que es una cita
    - Útil para atribuir palabras a alguien
    - El navegador maneja las comillas automáticamente
    -->
</body>
</html>
