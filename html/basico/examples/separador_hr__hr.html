<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Separador Horizontal - HR</title>
</head>
<body>
    <h1>Elemento HR (Separador Horizontal)</h1>
    
    <h2>Tema 1: Introducción</h2>
    <p>Contenido de la introducción aquí...</p>
    
    <hr>
    
    <h2>Tema 2: Desarrollo</h2>
    <p>Contenido completamente diferente del tema anterior.</p>
    
    <hr>
    
    <h2>Tema 3: Conclusión</h2>
    <p>Un tercer tema independiente.</p>
    
    <!--
    Objetivo: usar hr para dividir temáticamente
    Referencia: <hr>
    Tipo: elemento vacío
    Nivel: basico
    
    Explicación:
    - <hr> crea una línea horizontal
    - Marca un cambio TEMÁTICO en el contenido
    - Es un elemento VACÍO (no tiene contenido)
    - Semánticamente: "pausa temática"
    - Casos válidos:
      * Cambio de tema importante
      * Transición entre secciones
      * Separación de actos (en literatura)
    - Mejor: usa <section> para semántica moderna
    - NO usar para diseño/decoración
    - Puede personalizarse con CSS
    -->
</body>
</html>
