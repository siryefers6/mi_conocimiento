<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Address</title>
</head>
<body>
    <article>
        <h1>Contacto de la empresa</h1>
        <p>Información de ubicación...</p>
        
        <address>
            <strong>MiEmpresa S.L.</strong><br>
            Calle Principal, 123<br>
            28001 Madrid, España<br>
            <a href="tel:+34912345678">+34 912 345 678</a><br>
            <a href="mailto:info@miempresa.com">info@miempresa.com</a>
        </address>
    </article>
    
    <footer>
        <address>
            Hecho por <a href="mailto:autor@ejemplo.com">Juan García</a>
        </address>
    </footer>
    
    <!--
    Objetivo: marcar información de contacto
    Referencia: <address>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <address> para información de contacto
    - NO para direcciones postales genéricas
    - Casos de uso:
      * Contacto de la página
      * Contacto del autor
      * Contacto de la organización
    - Puede contener:
      * Dirección postal
      * Email
      * Teléfono
      * Links de contacto
    - Semánticamente clara
    - Mejora SEO (schema.org)
    - Accesibilidad mejorada
    - Atributos: ninguno especial
    -->
</body>
</html>
