<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hipervínculo - A</title>
</head>
<body>
    <h1>Elemento A (Hipervínculo)</h1>
    
    <h2>Enlace a otra página</h2>
    <a href="https://www.ejemplo.com">Ir a Ejemplo.com</a>
    
    <h2>Enlace relativo</h2>
    <a href="/acerca">Acerca de nosotros</a>
    <a href="./contacto.html">Formulario de Contacto</a>
    
    <h2>Enlace a archivo</h2>
    <a href="documento.pdf">Descargar PDF</a>
    
    <!--
    Objetivo: crear hipervínculos básicos
    Referencia: <a>, href
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <a> crea un hipervínculo clickeable
    - href: especifica el destino del enlace
    - Puede ser:
      * URL absoluta: https://ejemplo.com
      * URL relativa: /pagina, ./archivo.html
      * Archivo: documento.pdf
    - El texto dentro de <a> es lo que se ve
    - Los navegadores lo muestran en azul subrayado
    - Los enlaces son fundamentales para la web
    -->
</body>
</html>
