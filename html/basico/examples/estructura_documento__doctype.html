<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura de Documento HTML</title>
</head>
<body>
    <h1>Estructura Básica de un Documento HTML</h1>
    <p>Este archivo demuestra la estructura mínima y correcta de un documento HTML5.</p>
    
    <!--
    Objetivo: entender la estructura fundamental de un documento HTML
    Referencia: <!DOCTYPE>, <html>, <head>, <body>, <title>, <meta>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <!DOCTYPE html>: declara que es HTML5 (obligatorio, debe ser lo primero)
    - <html lang="es">: elemento raíz, atributo lang define idioma
    - <head>: contiene metadatos no visibles
    - <meta charset="UTF-8">: especifica codificación de caracteres
    - <meta viewport>: hace el sitio responsivo en móviles
    - <title>: aparece en la pestaña del navegador y en SEO
    - <body>: contiene todo el contenido visible
    
    Estructura jerárquica:
    HTML
    ├── HEAD (metadatos)
    │   ├── meta (charset, viewport)
    │   ├── title
    │   └── link (CSS, etc)
    └── BODY (contenido)
        ├── header
        ├── main
        ├── footer
        └── script (JS)
    -->
</body>
</html>
