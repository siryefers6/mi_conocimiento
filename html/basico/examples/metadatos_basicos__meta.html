<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descripción breve de la página para buscadores">
    <meta name="author" content="Tu Nombre">
    <meta name="keywords" content="html, metadatos, seo">
    <title>Metadatos Básicos en HTML</title>
</head>
<body>
    <h1>Metadatos Básicos</h1>
    <p>Los metadatos se definen en el &lt;head&gt; y controlan cómo se ve la página.</p>
    
    <!--
    Objetivo: entender cómo usar metadatos básicos
    Referencia: <meta charset>, <meta viewport>, <meta name>, <meta content>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <meta charset="UTF-8">: codificación de caracteres (acentos, símbolos)
    - <meta viewport>: width=device-width hace el sitio responsivo
    - <meta name="description">: resumen para buscadores (155-160 caracteres)
    - <meta name="author">: autor de la página
    - <meta name="keywords">: palabras clave (menos importante hoy)
    - Los metadatos NO aparecen en la página, solo en el HTML
    - Content-Type: UTF-8 es el estándar moderno
    -->
</body>
</html>
