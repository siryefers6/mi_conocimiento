<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H6</title>
</head>
<body>
    <h1>Especificación Técnica</h1>
    <h2>Requisitos del Sistema</h2>
    <h3>Hardware</h3>
    <h4>CPU</h4>
    <h5>Arquitectura x86-64</h5>
    <h6>Instrucciones SSE2</h6>
    <p>Instrucciones requeridas...</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h6
    Referencia: <h6>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h6 es el nivel MÁS PROFUNDO de encabezados
    - NO DEBE usarse en HTML moderno (rarísimo)
    - Si necesitas h6, reestructura completamente tu contenido
    - Es un antipatrón de diseño HTML
    - Mejor solución: párrafos con <strong> o listas
    - Los navegadores y accesibilidad se ven afectados
    - Máximo recomendado: h1 + h2 + h3 (en casos especiales)
    -->
</body>
</html>
