<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italic - I</title>
</head>
<body>
    <h1>Elemento I (Italic)</h1>
    
    <p>Este es <i>texto en cursiva</i> sin énfasis semántico.</p>
    
    <p>Prefiere <em>em</em> en lugar de <i>i</i> para énfasis.</p>
    
    <p>Casos válidos de i:</p>
    <ul>
        <li>Títulos de libros: <i>El Quijote</i></li>
        <li>Palabras extranjeras: <i>déjà vu</i></li>
        <li>Nombres científicos: <i>Canis familiaris</i></li>
    </ul>
    
    <!--
    Objetivo: entender la diferencia entre i y em
    Referencia: <i>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <i> es puramente presentacional (italic)
    - NO tiene significado semántico
    - El navegador lo muestra en cursiva
    - Usa <i> para estilo sin énfasis
    - Usa <em> cuando necesitas énfasis semántico
    - Casos válidos de <i>:
      * Títulos de obras
      * Palabras extranjeras
      * Nombres científicos
      * Nombres de barcos/películas
    -->
</body>
</html>
