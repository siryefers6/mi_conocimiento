<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Text</title>
</head>
<body>
    <h1>Input type="text"</h1>
    
    <form>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
        <br><br>
        
        <label for="busqueda">Búsqueda:</label>
        <input type="text" id="busqueda" name="busqueda" maxlength="50">
    </form>
    
    <!--
    Objetivo: entrada de texto simple
    Referencia: <input type="text">
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - type="text" entrada de una línea
    - Atributos comunes:
      * placeholder = texto de ayuda
      * maxlength = máximo de caracteres
      * minlength = mínimo de caracteres
      * pattern = expresión regular
      * value = valor inicial
      * readonly = solo lectura
      * disabled = deshabilitado
      * autocomplete = sugerencias
    - Validación básica de HTML5
    - Para textos largos usar <textarea>
    -->
</body>
</html>
