<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Header</title>
</head>
<body>
    <header>
        <h1>Mi Sitio Web</h1>
        <nav>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/about">Acerca de</a></li>
                <li><a href="/servicios">Servicios</a></li>
                <li><a href="/contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <article>
            <h2>Artículo 1</h2>
            <p>Contenido...</p>
        </article>
    </main>
    
    <footer>
        <p>&copy; 2024 Mi Sitio. Todos los derechos reservados.</p>
    </footer>
    
    <!--
    Objetivo: encabezado de página (semántico)
    Referencia: <header>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <header> encabezado principal
    - Típicamente contiene:
      * <h1> título sitio
      * <nav> navegación
      * Logo, branding
    - Puede haber múltiples <header>
    - No es solo <h1>
    - Atributos: ninguno especial
    - Mejora SEO y accesibilidad
    - Casos válidos:
      * Encabezado página
      * Encabezado artículo
      * Encabezado sección
    - Alternativa a <div class="header">
    -->
</body>
</html>
