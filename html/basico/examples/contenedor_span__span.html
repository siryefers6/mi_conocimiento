<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedor - Span</title>
</head>
<body>
    <h1>Elemento SPAN</h1>
    
    <p>Este es un párrafo con <span class="destaque">texto destacado</span> en el medio.</p>
    
    <p>También puedes <span style="color: red;">cambiar el color</span> de partes específicas.</p>
    
    <p>Y aplicar <span id="importante">identificadores</span> a porciones de texto.</p>
    
    <p>Útil para <span class="negrita">formato selectivo</span> sin afectar estructura.</p>
    
    <!--
    Objetivo: contenedor genérico inline (línea)
    Referencia: <span>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <span> contenedor genérico inline
    - SIN significado semántico
    - Para aplicar estilos a texto
    - Atributos comunes:
      * class = clases CSS
      * id = identificador
      * style = estilos inline
    - NO salto de línea
    - Ocupa solo espacio necesario
    - Casos de uso:
      * Destaca partes de texto
      * Aplicar estilos selectivos
      * Identificar para JavaScript
    - Alternativa: <em>, <strong>, <b>, <i>
    - Preferir elementos más específicos
    - Neutral para SEO si no tiene clase/id
    -->
</body>
</html>
