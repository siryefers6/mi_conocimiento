<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salto de Línea - BR</title>
</head>
<body>
    <h1>Elemento BR (Salto de Línea)</h1>
    
    <h2>Dirección</h2>
    <address>
        Calle Principal 123<br>
        Apartamento 5B<br>
        Ciudad, País 12345<br>
        Teléfono: +1 (555) 123-4567
    </address>
    
    <h2>Poesía</h2>
    <p>
        Roses are red<br>
        Violets are blue<br>
        This is a poem<br>
        Just for you
    </p>
    
    <!--
    Objetivo: usar br para saltos de línea
    Referencia: <br>
    Tipo: elemento vacío (self-closing)
    Nivel: basico
    
    Explicación:
    - <br> fuerza un salto de línea
    - Es un elemento VACÍO (no tiene contenido)
    - NO usar para espaciado (usa CSS margin/padding)
    - Casos válidos:
      * Direcciones (múltiples líneas)
      * Poesía
      * Líneas de código cortas
      * Cambios de línea semánticamente importantes
    - NUNCA: <p>texto<br><br><br></p> para espaciar
    - Usar margin/padding de CSS en su lugar
    -->
</body>
</html>
