<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tachado - S</title>
</head>
<body>
    <h1>Elemento S (Strikethrough)</h1>
    
    <p>Precio anterior: <s>$100</s> Ahora: <strong>$50</strong></p>
    
    <p>Este plan ya no está disponible: <s>Plan Basic</s></p>
    
    <p>Cambios en el documento:</p>
    <ul>
        <li><s>Versión 1.0</s> (obsoleta)</li>
        <li>Versión 2.0 (actual)</li>
    </ul>
    
    <!--
    Objetivo: entender cuándo usar el elemento s
    Referencia: <s>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <s> marca texto que ya no es relevante/válido
    - Muestra una línea horizontal sobre el texto (tachado)
    - Diferencia: <s> vs <del>
      * <s> = ya no es exacto/relevante
      * <del> = fue removido del documento
    - Casos válidos:
      * Precios viejos vs nuevos
      * Características descontinuadas
      * Información obsoleta
    - NO es lo mismo que <strike> (deprecated)
    -->
</body>
</html>
