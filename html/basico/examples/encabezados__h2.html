<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H2</title>
</head>
<body>
    <h1>Página Principal</h1>
    
    <h2>Primera Sección</h2>
    <p>Contenido de la primera sección...</p>
    
    <h2>Segunda Sección</h2>
    <p>Contenido de la segunda sección...</p>
    
    <h2>Tercera Sección</h2>
    <p>Contenido de la tercera sección...</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h2
    Referencia: <h2>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h2 es un subtítulo dentro de la página
    - Puede haber múltiples h2
    - Jerarquía: h1 > h2 > h3 > h4 > h5 > h6
    - Los h2 deben estar dentro del h1 temáticamente
    - Usa h2 para dividir la página en secciones principales
    - Mejora la estructura y SEO
    -->
</body>
</html>
