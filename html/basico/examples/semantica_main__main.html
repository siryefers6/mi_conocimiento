<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Main</title>
</head>
<body>
    <header>
        <h1>Tienda Online</h1>
    </header>
    
    <nav>
        <a href="/">Inicio</a> | <a href="/productos">Productos</a>
    </nav>
    
    <main>
        <h1>Nuestros Productos</h1>
        
        <article>
            <h2>Producto 1</h2>
            <p>Descripción producto...</p>
        </article>
        
        <article>
            <h2>Producto 2</h2>
            <p>Descripción producto...</p>
        </article>
    </main>
    
    <footer>
        <p>Copyright 2024</p>
    </footer>
    
    <!--
    Objetivo: contenido principal de página
    Referencia: <main>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <main> contenido principal
    - UNO por página
    - Agrupa contenido central
    - No: <header>, <nav>, <footer>, <aside>
    - Atributos: ninguno especial
    - Mejora estructura semántica
    - Accesibilidad: saltar a contenido
    - SEO: identifica contenido importante
    - Casos válidos:
      * Artículo principal
      * Listado de productos
      * Formulario de registro
    -->
</body>
</html>
