<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H1</title>
</head>
<body>
    <h1>Este es un H1 - Título Principal</h1>
    <p>Solo debe haber UN h1 por página. Es el título más importante para SEO.</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h1
    Referencia: <h1>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h1 es el encabezado más importante
    - Una página debe tener UNO Y SOLO UN h1
    - Define el tema principal de la página
    - Es crítico para SEO (buscadores lo ponderan mucho)
    - No usar para estilizar texto grande (usa CSS)
    - Los h1 son elementos de bloque
    -->
</body>
</html>
