<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H5</title>
</head>
<body>
    <h1>Documentación Técnica</h1>
    <h2>API Reference</h2>
    <h3>Endpoints</h3>
    <h4>GET /users</h4>
    <h5>Parámetros de Query</h5>
    <p>page, limit, sort...</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h5
    Referencia: <h5>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h5 es un nivel MUY profundo de anidación
    - Casi nunca se usa en HTML moderno
    - Si necesitas h5, probablemente debas reestructurar tu contenido
    - Es un indicador de jerarquía demasiado compleja
    - Mejor solución: usar listas y formato con párrafos
    - Los lectores de pantalla pueden tener dificultades
    -->
</body>
</html>
