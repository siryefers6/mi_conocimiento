<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Footer</title>
</head>
<body>
    <header>
        <h1>Mi Empresa</h1>
    </header>
    
    <main>
        <h2>Servicios</h2>
        <p>Ofrecemos servicios de consultoría...</p>
    </main>
    
    <footer>
        <section>
            <h3>Navegación</h3>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/servicios">Servicios</a></li>
                <li><a href="/contacto">Contacto</a></li>
            </ul>
        </section>
        
        <section>
            <h3>Información Legal</h3>
            <ul>
                <li><a href="/politica">Política de privacidad</a></li>
                <li><a href="/terminos">Términos de servicio</a></li>
            </ul>
        </section>
        
        <section>
            <h3>Contacto</h3>
            <p>Email: <a href="mailto:info@ejemplo.com">info@ejemplo.com</a></p>
            <p>&copy; 2024 Mi Empresa. Todos los derechos.</p>
        </section>
    </footer>
    
    <!--
    Objetivo: pie de página
    Referencia: <footer>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <footer> pie de página
    - Contiene información de cierre
    - Puede haber múltiples <footer>
    - Casos de uso:
      * Pie de página sitio
      * Pie de artículo
      * Pie de sección
    - Típicamente contiene:
      * Links de navegación
      * Información legal
      * Contacto
      * Copyright
      * Redes sociales
    - Atributos: ninguno especial
    - Mejora semántica
    - SEO: información importante
    - Accesibilidad mejorada
    -->
</body>
</html>
