<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace de Teléfono</title>
</head>
<body>
    <h1>Enlace TEL</h1>
    
    <h2>Llamada telefónica</h2>
    <p>Llámanos: <a href="tel:+34-91-123-4567">+34 91 123 4567</a></p>
    
    <h2>Número simple</h2>
    <a href="tel:5551234567">+1 (555) 123-4567</a>
    
    <h2>Extensión</h2>
    <a href="tel:+1-800-555-1234;ext=5678">1-800-555-1234 ext. 5678</a>
    
    <!--
    Objetivo: crear enlaces de teléfono
    Referencia: href="tel:"
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - tel: permite llamar directamente desde el navegador
    - Formato: tel:+código-número
    - En teléfonos: abre la aplicación de llamadas
    - En computadoras: puede abrir Skype, Zoom, etc
    - Casos válidos:
      * Números de contacto
      * Call centers
      * Soporte técnico
    - El formato debe ser valid E.164
    - Solo dígitos, +, - y paréntesis
    - Mejora UX en móviles
    - Accesible para usuarios
    -->
</body>
</html>
