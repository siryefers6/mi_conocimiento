<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preformateado - Pre</title>
</head>
<body>
    <h1>Elemento PRE (Preformateado)</h1>
    
    <h2>Ejemplo de código en ASCII</h2>
    <pre>
    +-----+
    |  o  |
    | <3  |
    | / \ |
    +-----+
    </pre>
    
    <h2>Código con espacios preservados</h2>
    <pre><code>
function hola() {
    console.log('Hola Mundo');
}
    </code></pre>
    
    <!--
    Objetivo: usar pre para código preformateado
    Referencia: <pre>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <pre> preserva TODOS los espacios y saltos de línea
    - Por defecto usa fuente monoespaciada
    - Útil para código con indentación importante
    - Casos válidos:
      * Código fuente
      * ASCII art
      * Salida de comandos
      * Archivos de configuración
    - Combina con <code> para semántica completa
    - Los espacios en blanco SÍ se muestran
    - Mejor que usar múltiples &nbsp;
    -->
</body>
</html>
