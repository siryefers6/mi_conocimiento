<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H3</title>
</head>
<body>
    <h1>Guía de Compra</h1>
    
    <h2>Laptops</h2>
    <h3>Gaming</h3>
    <p>Laptops de alto rendimiento para juegos...</p>
    
    <h3>Negocios</h3>
    <p>Laptops ultraligeras para profesionales...</p>
    
    <h2>Monitores</h2>
    <h3>4K</h3>
    <p>Monitores ultra HD...</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h3
    Referencia: <h3>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h3 es un sub-subtítulo (subsección)
    - Debe estar dentro de un h2
    - Crea jerarquía más profunda
    - Ejemplo: h1 (Guía) > h2 (Laptops) > h3 (Gaming)
    - Útil para organización más detallada
    - Los h3 son útiles pero h2 generalmente es suficiente
    -->
</body>
</html>
