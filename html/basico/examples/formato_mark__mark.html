<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resaltado - Mark</title>
</head>
<body>
    <h1>Elemento MARK (Resaltado)</h1>
    
    <p>Los puntos <mark>más importantes</mark> del artículo están resaltados.</p>
    
    <p>Búsqueda de <mark>JavaScript</mark> encontró: Las mejores prácticas de <mark>JavaScript</mark> moderno.</p>
    
    <p>Cambios: <mark>Este párrafo fue agregado</mark> en la última versión.</p>
    
    <!--
    Objetivo: usar mark para resaltar texto
    Referencia: <mark>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <mark> resalta texto como si lo marcaras con marcador
    - Por defecto: fondo amarillo con texto negro
    - Casos válidos:
      * Términos de búsqueda
      * Puntos importantes (aunque mejor usa CSS)
      * Cambios en el documento
      * Información crítica
    - Es semántico: declara que el texto es importante/relevante
    - Puedes personalizar el color con CSS
    - NO usar solo para estilizar (mejor usa <strong>)
    -->
</body>
</html>
