<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figura - Figure</title>
</head>
<body>
    <h1>Elemento FIGURE y FIGCAPTION</h1>
    
    <h2>Imagen con leyenda</h2>
    <figure>
        <img src="grafica-ventas.jpg" alt="Gráfica de ventas mensuales de 2024">
        <figcaption>Figura 1: Ventas mensuales mostrando crecimiento del 45% respecto a 2023</figcaption>
    </figure>
    
    <h2>Código con leyenda</h2>
    <figure>
        <pre><code>
function hola() {
    console.log('Hola Mundo');
}
        </code></pre>
        <figcaption>Figura 2: Función simple en JavaScript</figcaption>
    </figure>
    
    <!--
    Objetivo: asociar imágenes con leyendas
    Referencia: <figure>, <figcaption>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <figure> agrupa una imagen/código con su leyenda
    - <figcaption> proporciona la leyenda
    - Semánticamente: declara que van juntos
    - Casos válidos:
      * Imágenes del artículo
      * Gráficas con explicación
      * Código ilustrativo
      * Diagramas
    - La figcaption puede estar antes o después
    - Mejora el SEO y accesibilidad
    - Los lectores de pantalla lo entienden
    -->
</body>
</html>
