<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold - B</title>
</head>
<body>
    <h1>Elemento B (Bold)</h1>
    
    <p>Este es <b>texto en negrita</b> sin importancia semántica.</p>
    
    <p>El elemento b es para <b>presentación únicamente</b>.</p>
    
    <p>Prefiere <strong>strong</strong> en lugar de <b>b</b> cuando sea posible.</p>
    
    <p>Caso válido de b: <b>Primera aparición</b> de un término.</p>
    
    <!--
    Objetivo: entender la diferencia entre b y strong
    Referencia: <b>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <b> es puramente presentacional (bold)
    - NO tiene significado semántico
    - El navegador lo muestra en negrita
    - Usa <b> cuando quieres texto grueso sin importancia
    - Usa <strong> cuando el contenido ES importante
    - Diferencia para lectores de pantalla y SEO
    - Caso válido: <b>primeras palabras</b> de artículo
    -->
</body>
</html>
