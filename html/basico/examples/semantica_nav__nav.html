<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semántica - Nav</title>
</head>
<body>
    <nav>
        <h2>Navegación Principal</h2>
        <ul>
            <li><a href="/">Inicio</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/servicios">Servicios</a></li>
            <li><a href="/contacto">Contacto</a></li>
        </ul>
    </nav>
    
    <main>
        <article>
            <h1>Bienvenido</h1>
            <p>Contenido de ejemplo</p>
            
            <nav>
                <h3>Tabla de contenidos</h3>
                <ul>
                    <li><a href="#introduccion">Introducción</a></li>
                    <li><a href="#desarrollo">Desarrollo</a></li>
                    <li><a href="#conclusion">Conclusión</a></li>
                </ul>
            </nav>
        </article>
    </main>
    
    <!--
    Objetivo: sección de navegación
    Referencia: <nav>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - <nav> agrupa enlaces de navegación
    - Típicamente lista <ul> de enlaces
    - Puede haber múltiples <nav>
    - Casos de uso:
      * Navegación principal
      * Tabla de contenidos
      * Migas de pan (breadcrumbs)
      * Navegación pie de página
    - Semánticamente clara
    - Atributos: ninguno especial
    - Mejora accesibilidad
    - Lectores de pantalla la identifican
    - Mejora SEO
    -->
</body>
</html>
