<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atributo Style</title>
</head>
<body>
    <h1 style="color: blue; font-size: 32px;">Título con estilos</h1>
    
    <p style="background-color: lightyellow; padding: 10px; border: 1px solid orange;">
        Párrafo con estilos inline.
    </p>
    
    <div style="
        width: 300px;
        height: 200px;
        background: linear-gradient(45deg, #3498db, #2ecc71);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        border-radius: 10px;
    ">
        Caja estilizada
    </div>
    
    <!--
    Objetivo: aplicar estilos CSS directamente al elemento
    Referencia: style
    Tipo: atributo
    Nivel: basico
    
    Explicación:
    - style = estilos CSS inline
    - Sintaxis: style="propiedad: valor;"
    - Especificidad ALTA
    - Casos de uso:
      * Estilos únicos y puntuales
      * Sobreescrituras de emergencia
      * Estilos dinámicos (JavaScript)
    - Propiedades CSS:
      * color = color de texto
      * background = fondo
      * font-size = tamaño fuente
      * padding = relleno interno
      * margin = margen externo
      * width/height = dimensiones
    - Separar por semicolons
    - EVITAR uso excesivo
    - Preferir <style> en <head>
    - Mantener en archivos .css
    -->
</body>
</html>
