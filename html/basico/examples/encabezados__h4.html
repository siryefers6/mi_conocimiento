<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado H4</title>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    
    <h2>Electrónica</h2>
    <h3>Computadoras</h3>
    <h4>Procesadores Intel</h4>
    <p>Modelos disponibles...</p>
    
    <h4>Procesadores AMD</h4>
    <p>Alternativas...</p>
    
    <!--
    Objetivo: usar correctamente el encabezado h4
    Referencia: <h4>
    Tipo: elemento
    Nivel: basico
    
    Explicación:
    - El h4 es un nivel de anidación adicional
    - Muy pocas páginas necesitan h4 (indica demasiada profundidad)
    - Si necesitas h4, considera reorganizar el contenido
    - Jerarquía: h1 > h2 > h3 > h4
    - Mejor usar máximo hasta h3 en la mayoría de casos
    - h4-h6 son muy raros
    -->
</body>
</html>
