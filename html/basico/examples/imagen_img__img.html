<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen - IMG</title>
</head>
<body>
    <h1>Elemento IMG</h1>
    
    <h2>Imagen local</h2>
    <img src="/ruta/imagen.jpg" alt="Descripción de la imagen">
    
    <h2>Imagen de internet</h2>
    <img src="https://via.placeholder.com/300x200" alt="Imagen de placeholder">
    
    <h2>Imagen PNG transparente</h2>
    <img src="logo.png" alt="Logo de la empresa">
    
    <!--
    Objetivo: insertar imágenes correctamente
    Referencia: <img>, src, alt
    Tipo: elemento vacío
    Nivel: basico
    
    Explicación:
    - <img> inserta una imagen
    - Es un elemento VACÍO (no tiene contenido)
    - src: ruta de la imagen (obligatorio)
    - alt: texto alternativo (OBLIGATORIO para accesibilidad)
    - Rutas:
      * Absoluta: https://ejemplo.com/imagen.jpg
      * Relativa: /ruta/imagen.jpg o ./imagen.jpg
    - El alt es crítico para:
      * SEO
      * Accesibilidad
      * Cuando la imagen no carga
    - Siempre incluir alt descriptivo
    -->
</body>
</html>
