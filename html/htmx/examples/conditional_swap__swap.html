<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Eventos</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>beforeRequest, afterRequest, afterSwap, afterSettle, responseError, beforeSend</h1>
    
    <button hx-get="/api/1"
            hx-on="htmx:beforeRequest: console.log('antes')
                   htmx:afterRequest: console.log('después')
                   htmx:afterSwap: console.log('swap')
                   htmx:afterSettle: console.log('settle')
                   htmx:responseError: console.log('error')
                   htmx:beforeSend: console.log('envío')">
        Eventos
    </button>
</body>
</html>
