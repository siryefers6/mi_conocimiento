<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX timeout headers</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Request timeout y headers personalizados</h1>
    
    <button hx-get="/api/slow" hx-request='{"timeout": 10000}'>
        Timeout 10s
    </button>
    
    <button hx-post="/api/secure" hx-request='{"headers": {"X-API-Key": "secret", "Authorization": "Bearer xyz"}}'>
        Con headers
    </button>
</body>
</html>
