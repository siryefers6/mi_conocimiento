<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX hx-target previous</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Destino "previous" - Elemento Anterior Hermano</h1>
    
    <div style="background: #f0f0f0; padding: 10px; border: 1px solid blue;">
        Contenido aquí
    </div>
    
    <button hx-get="/api/content" 
            hx-target="previous"
            hx-swap="innerHTML">
        Actualizar elemento anterior
    </button>
    
    <br><br>
    
    <!-- Ejemplo en tabla -->
    <table style="border-collapse: collapse;">
        <tr>
            <td style="border: 1px solid #ccc; padding: 10px;">Fila 1</td>
            <td style="border: 1px solid #ccc; padding: 10px;">
                <button hx-delete="/api/row" hx-target="previous" hx-swap="outerHTML">Eliminar</button>
            </td>
        </tr>
        <tr>
            <td style="border: 1px solid #ccc; padding: 10px;">Fila 2</td>
            <td style="border: 1px solid #ccc; padding: 10px;">
                <button hx-delete="/api/row" hx-target="previous" hx-swap="outerHTML">Eliminar</button>
            </td>
        </tr>
    </table>
    
    <!--
    Objetivo: Apuntar al elemento anterior hermano
    Referencia: hx-target="previous"
    Tipo: atributo
    Nivel: intermedio
    
    Explicación:
    - hx-target="previous" apunta al anterior elemento hermano (sibling)
    - Busca hacia atrás, no hacia adelante
    - Útil cuando el contenido está antes del botón
    
    Ejemplo:
    <div>Este div se actualiza (previous)</div>
    <button hx-target="previous">...</button>
    
    Variantes:
    * previous: elemento anterior hermano
    * previous .clase: anterior hermano con esa clase
    * previous td: anterior hermano que sea td
    
    Si no hay elemento anterior, usa "this"
    -->
</body>
</html>
