<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Trigger revealed</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Trigger revealed - Cuando se ve en pantalla</h1>
    
    <div style="height: 1000px; background: #f0f0f0; padding: 20px;">
        <p>Scrollea hacia abajo...</p>
    </div>
    
    <div hx-get="/api/lazy-content" 
         hx-trigger="revealed"
         hx-target="#content">
        Cargando cuando sea visible...
    </div>
    
    <div id="content"></div>
    
    <!--revealed: Se dispara cuando el elemento aparece en el viewport-->
</body>
</html>
