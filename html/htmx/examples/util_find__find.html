<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX util find toggle remove add swap</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>find, toggle, remove, add, swap</h1>
    <button onclick="let e = htmx.find('#myid')">find()</button>
    <button onclick="htmx.toggleClass(this, 'active')">toggleClass()</button>
    <button onclick="htmx.removeClass(this, 'active')">removeClass()</button>
    <button onclick="htmx.addClass(this, 'active')">addClass()</button>
    <button onclick="htmx.swap('#target', '<p>nuevo</p>')">swap()</button>
    <div id="target"></div>
</body>
</html>
