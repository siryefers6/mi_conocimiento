<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX hx-push-url hx-replace-url hx-push-url=false</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>URL History</h1>
    <button hx-get="/p1" hx-push-url="/custom-url">Push Custom</button>
    <button hx-get="/p2" hx-replace-url="/replace">Replace</button>
    <button hx-get="/p3" hx-push-url="false">Sin historial</button>
</body>
</html>
