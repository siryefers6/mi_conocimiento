<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX config</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <script>
        htmx.config.timeout = 5000;
        htmx.config.defaultIndicatorStyle = 'class';
    </script>
</head>
<body>
    <h1>Configuración global</h1>
    
    <button hx-get="/api/1">Usa timeout global de 5s</button>
</body>
</html>
