<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX WebSocket</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>WebSocket connect send</h1>
    <div id="ws" hx-ws="connect /ws:updates">
        Conectando a WebSocket...

    <button hx-ws="send">Enviar mensaje</button>
</body>
</html>
