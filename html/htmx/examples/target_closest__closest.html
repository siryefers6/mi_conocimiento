<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX hx-target closest</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Destino "closest" - Buscar Ancestro</h1>
    
    <div class="container" style="border: 1px solid blue; padding: 20px; margin: 10px 0;">
        <h3>Contenedor 1</h3>
        <button hx-get="/api/content" 
                hx-target="closest .container" 
                hx-swap="innerHTML">
            Actualizar Contenedor
        </button>
        <div id="content-1"></div>
    </div>
    
    <div class="container" style="border: 1px solid green; padding: 20px; margin: 10px 0;">
        <h3>Contenedor 2</h3>
        <button hx-get="/api/content" 
                hx-target="closest .container" 
                hx-swap="innerHTML">
            Actualizar Contenedor
        </button>
        <div id="content-2"></div>
    </div>
    
    <!-- Ejemplo más complejo con profundidad -->
    <div class="card" style="border: 1px solid red; padding: 20px;">
        <div class="header">
            <h4>Card</h4>
            <button hx-delete="/api/card/1"
                    hx-target="closest .card"
                    hx-swap="outerHTML">
                Eliminar Card
            </button>
        </div>
        <div class="body">
            Contenido de la card
        </div>
    </div>
    
    <!--
    Objetivo: Buscar elemento ancestro que coincida con selector
    Referencia: hx-target="closest SELECTOR"
    Tipo: atributo
    Nivel: intermedio
    
    Explicación:
    - hx-target="closest .clase" busca ancestro con esa clase
    - Busca hacia arriba en el árbol DOM
    - Muy útil para patrones como cards, rows, etc
    
    Ventajas:
    * No necesitas IDs únicos
    * Funciona con múltiples elementos similares
    * Cada elemento actualiza su propio contenedor
    
    Sintaxis:
    * hx-target="closest .card" busca ancestro con clase "card"
    * hx-target="closest div" busca ancestro que sea div
    * hx-target="closest [data-id]" busca ancestro con atributo
    
    Patrón muy común:
    - Botón dentro de una fila/card
    - Botón busca el contenedor (closest)
    - Actualiza solo su contenedor
    
    Si no encuentra ancestro, usa "this"
    -->
</body>
</html>
