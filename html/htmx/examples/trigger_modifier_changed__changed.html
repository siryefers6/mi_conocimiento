<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Trigger changed</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Trigger modifier: changed</h1>
    
    <input type="text" 
           placeholder="Escriba y presione Enter" 
           hx-get="/api/search" 
           hx-trigger="change changed">
    
    <!--
    changed: Solo dispara si el valor cambió
    Se usa con change para evitar requests innecesarios
    -->
</body>
</html>
