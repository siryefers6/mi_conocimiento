<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX util toggle remove add swap</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>toggleClass, removeClass, addClass, swap</h1>
    <button onclick="htmx.toggleClass(this, 'on')">toggle</button>
    <button onclick="htmx.removeClass(this, 'on')">remove</button>
    <button onclick="htmx.addClass(this, 'on')">add</button>
    <button onclick="htmx.swap('#out', '<p>nuevo</p>')">swap</button>
    <div id="out"></div>
</body>
</html>
