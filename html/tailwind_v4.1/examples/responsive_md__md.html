<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive MD - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Responsive - Breakpoint MD</h1>
        <p class="text-gray-600 mb-8">Punto de quiebre mediano (768px)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="w-full md:w-2/3 bg-blue-500 text-white p-4 rounded">
                2/3 del ancho en MD+
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                <div class="bg-green-500 text-white p-4 rounded">Item 1</div>
                <div class="bg-purple-500 text-white p-4 rounded">Item 2</div>
                <div class="bg-red-500 text-white p-4 rounded">Item 3</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-full md:w-2/3"&gt;
  Responsivo en punto MD
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
