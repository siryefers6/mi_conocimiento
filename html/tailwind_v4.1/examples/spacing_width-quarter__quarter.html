<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width 1/4 - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Width - 1/4 (25%)</h1>
        <p class="text-gray-600 mb-8">Ancho de un cuarto</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex gap-2">
                <div class="w-1/4 bg-blue-500 text-white p-4 rounded text-center">w-1/4</div>
                <div class="w-1/4 bg-green-500 text-white p-4 rounded text-center">w-1/4</div>
                <div class="w-1/4 bg-red-500 text-white p-4 rounded text-center">w-1/4</div>
                <div class="w-1/4 bg-purple-500 text-white p-4 rounded text-center">w-1/4</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-1/4"&gt;
  25% ancho
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
