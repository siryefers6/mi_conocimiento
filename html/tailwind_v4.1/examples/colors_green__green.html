<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Green - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Palette - Green</h1>
        <p class="text-gray-600 mb-8">Paleta completa de colores verdes</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-green-50 p-4 rounded border border-gray-200">green-50</div>
                <div class="bg-green-100 p-4 rounded border border-gray-200">green-100</div>
                <div class="bg-green-300 p-4 rounded border border-gray-200 text-white">green-300</div>
                <div class="bg-green-500 p-4 rounded border border-gray-200 text-white">green-500</div>
                <div class="bg-green-700 p-4 rounded border border-gray-200 text-white">green-700</div>
                <div class="bg-green-900 p-4 rounded border border-gray-200 text-white">green-900</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-green-500"&gt;
  Fondo verde
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
