<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Right - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Gradient - To Right</h1>
        <p class="text-gray-600 mb-8">Gradiente de izquierda a derecha</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="h-24 bg-gradient-to-r from-blue-500 to-purple-500 rounded"></div>
            <div class="h-24 bg-gradient-to-r from-red-400 to-yellow-500 rounded"></div>
            <div class="h-24 bg-gradient-to-r from-green-400 to-blue-500 rounded"></div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-gradient-to-r from-blue-500 to-purple-500"&gt;
  Gradiente a derecha
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
