<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity 100 - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Opacity - 100 (Opaco)</h1>
        <p class="text-gray-600 mb-8">Elemento completamente opaco (predeterminado)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="bg-blue-500 text-white p-4 rounded opacity-100">opacity-100 (opaco)</div>
            <div class="bg-blue-500 text-white p-4 rounded opacity-75">opacity-75</div>
            <div class="bg-blue-500 text-white p-4 rounded opacity-50">opacity-50</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="opacity-100"&gt;
  Elemento opaco
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
