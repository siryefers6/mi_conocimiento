<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Flex - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Display Flex</h1>
        <p class="text-gray-600 mb-8">Crea un contenedor flexbox para distribuir elementos horizontalmente</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Ejemplo Básico</h2>
            
            <div class="flex gap-4">
                <div class="flex-1 bg-blue-500 text-white p-4 rounded text-center">
                    Item 1
                </div>
                <div class="flex-1 bg-green-500 text-white p-4 rounded text-center">
                    Item 2
                </div>
                <div class="flex-1 bg-red-500 text-white p-4 rounded text-center">
                    Item 3
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mt-6">
            <h2 class="text-xl font-semibold mb-4">Con Alineación</h2>
            
            <div class="flex items-center justify-between gap-4 bg-gray-100 p-4 rounded">
                <div class="bg-blue-500 text-white p-3 rounded">
                    Inicio
                </div>
                <div class="bg-green-500 text-white p-3 rounded">
                    Centro
                </div>
                <div class="bg-red-500 text-white p-3 rounded">
                    Fin
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <h2 class="text-lg font-semibold mb-2">Código HTML</h2>
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex gap-4"&gt;
    &lt;div class="flex-1 bg-blue-500"&gt;Item&lt;/div&gt;
    &lt;div class="flex-1 bg-green-500"&gt;Item&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
