<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Top - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Margin - Top (mt-*)</h1>
        <p class="text-gray-600 mb-8">Margen solo en la parte superior</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="bg-gray-200 p-4">
                <div class="mt-2 bg-gray-100 border border-gray-300">mt-2</div>
                <div class="mt-4 bg-gray-100 border border-gray-300">mt-4</div>
                <div class="mt-6 bg-gray-100 border border-gray-300">mt-6</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="mt-4"&gt;
  Margen arriba 1rem
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
