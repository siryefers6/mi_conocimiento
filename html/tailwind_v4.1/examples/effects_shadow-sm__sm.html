<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow SM - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Shadow - Small</h1>
        <p class="text-gray-600 mb-8">Sombra sutil y pequeña</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="bg-white shadow-sm p-4 rounded">shadow-sm</div>
            <div class="bg-white shadow p-4 rounded">shadow</div>
            <div class="bg-white shadow-lg p-4 rounded">shadow-lg</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="shadow-sm"&gt;
  Sombra pequeña
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
