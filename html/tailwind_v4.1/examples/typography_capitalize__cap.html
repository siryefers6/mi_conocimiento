<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitalize - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Text Transform - Capitalize</h1>
        <p class="text-gray-600 mb-8">Primera letra de cada palabra mayúscula</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="capitalize">este texto tiene cada palabra capitalizada</p>
            <p class="uppercase">TEXTO EN MAYÚSCULAS</p>
            <p class="lowercase">TEXTO EN MINÚSCULAS</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="capitalize"&gt;
  Texto capitalizado
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
