<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Fixed - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Position Fixed</h1>
        <p class="text-gray-600 mb-8">Elemento fijo en la ventana (ve la esquina inferior derecha)</p>
        
        <div class="bg-white rounded-lg shadow p-6 h-64 overflow-y-auto">
            <p class="mb-4">Scroll aquí para ver elemento fijo</p>
            <div class="space-y-2 py-20">
                <p>Contenido 1</p>
                <p>Contenido 2</p>
                <p>Contenido 3</p>
                <p>Contenido 4</p>
                <p>Contenido 5</p>
            </div>
            <div class="fixed bottom-4 right-4 bg-blue-500 text-white px-4 py-2 rounded shadow-lg font-semibold">
                Elemento Fijo
            </div>
        </div>
    </div>
</body>
</html>
