<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow Auto - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Overflow - Auto</h1>
        <p class="text-gray-600 mb-8">Scroll automático cuando es necesario</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="overflow-auto w-full h-32 bg-gray-100 border-2 border-gray-300 rounded p-2">
                <div class="space-y-2">
                    <p>Línea 1</p>
                    <p>Línea 2</p>
                    <p>Línea 3</p>
                    <p>Línea 4</p>
                    <p>Línea 5</p>
                    <p>Línea 6</p>
                    <p>Línea 7</p>
                    <p>Línea 8</p>
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="overflow-auto w-full h-32"&gt;
  Contenido largo
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
