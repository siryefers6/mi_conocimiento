<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Transition - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Estados - Hover</h1>
        <p class="text-gray-600 mb-8">Cambios de estado al pasar el ratón</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded transition">
                Botón con Hover
            </button>
            <div class="border-2 border-gray-300 hover:border-blue-500 hover:bg-blue-50 p-4 rounded transition cursor-pointer">
                Hover para ver cambios
            </div>
            <a href="#" class="text-blue-600 hover:text-blue-800 hover:underline">
                Enlace con hover
            </a>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;button class="hover:bg-blue-600"&gt;
  Hover effect
&lt;/button&gt;</code></pre>
        </div>
    </div>
</body>
</html>
