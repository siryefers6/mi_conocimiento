<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Weight Light - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Font Weight - Light (300)</h1>
        <p class="text-gray-600 mb-8">Ligero</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="font-light">Este texto es font-light (300)</p>
            <p class="font-extralight">Este es font-extralight (200)</p>
            <p class="font-normal">Este es font-normal (400)</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="font-light"&gt;
  Texto ligero
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
