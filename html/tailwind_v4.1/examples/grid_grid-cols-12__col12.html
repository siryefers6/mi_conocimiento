<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 12 Columnas - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid 12 Columnas</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-12 gap-2">
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">1</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">2</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">3</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">4</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">5</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">6</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">7</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">8</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">9</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">10</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">11</div>
                <div class="col-span-1 bg-red-500 text-white p-3 rounded text-center text-xs">12</div>
                
                <div class="col-span-3 bg-purple-500 text-white p-3 rounded text-center text-xs">3 cols</div>
                <div class="col-span-3 bg-purple-500 text-white p-3 rounded text-center text-xs">3 cols</div>
                <div class="col-span-6 bg-purple-500 text-white p-3 rounded text-center text-xs">6 cols</div>
                
                <div class="col-span-12 bg-orange-500 text-white p-3 rounded text-center text-xs">12 columnas completas</div>
            </div>
        </div>
    </div>
</body>
</html>
