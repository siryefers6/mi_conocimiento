<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white dark:bg-gray-900 p-8 transition">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900 dark:text-white">Modo Oscuro</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-8">Habilitar/deshabilitar modo oscuro</p>
        
        <button onclick="document.documentElement.classList.toggle('dark')" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded mb-6">
            Alternar Modo Oscuro
        </button>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Contenido responsivo</h2>
            <p class="text-gray-700 dark:text-gray-300 mb-4">
                Este texto cambia de color en modo oscuro para mantener la legibilidad.
            </p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-blue-50 dark:bg-blue-900 p-4 rounded">
                    <p class="text-blue-900 dark:text-blue-100">Card azul</p>
                </div>
                <div class="bg-green-50 dark:bg-green-900 p-4 rounded">
                    <p class="text-green-900 dark:text-green-100">Card verde</p>
                </div>
            </div>
        </div>

        <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-white dark:bg-gray-800"&gt;
  Contenido adaptable a modo oscuro
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
