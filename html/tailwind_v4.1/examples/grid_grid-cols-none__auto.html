<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Auto - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid Auto (Sin Predefinir)</h1>
        <p class="text-gray-600 mb-8">Definir grid manualmente sin clase predefinida</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <style>
                .custom-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 1rem;
                }
            </style>
            <div class="custom-grid">
                <div class="bg-blue-500 text-white p-6 rounded text-center">1</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">2</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">3</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">4</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">5</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">6</div>
            </div>
        </div>
    </div>
</body>
</html>
