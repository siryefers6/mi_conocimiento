<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border 2px - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Border - 2px</h1>
        <p class="text-gray-600 mb-8">Borde de 2 píxeles</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="border border-gray-300 p-4 rounded">border (1px)</div>
            <div class="border-2 border-blue-500 p-4 rounded">border-2 (2px)</div>
            <div class="border-4 border-red-500 p-4 rounded">border-4 (4px)</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="border-2 border-blue-500"&gt;
  Borde de 2px
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
