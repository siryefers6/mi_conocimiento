<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Evenly - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Justify Evenly</h1>
        <p class="text-gray-600 mb-8">Distribuye espacio equitativo entre elementos</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-evenly gap-4 bg-gray-100 p-4 rounded">
                <div class="bg-green-500 text-white px-6 py-3 rounded">Item 1</div>
                <div class="bg-green-500 text-white px-6 py-3 rounded">Item 2</div>
                <div class="bg-green-500 text-white px-6 py-3 rounded">Item 3</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex justify-evenly"&gt;...&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
