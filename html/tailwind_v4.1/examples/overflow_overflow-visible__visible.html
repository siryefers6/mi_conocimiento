<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow Visible - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Overflow - Visible</h1>
        <p class="text-gray-600 mb-8">Contenido visible fuera del contenedor</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="overflow-visible w-32 h-32 bg-gray-100 border-2 border-gray-300 rounded">
                <div class="w-48 h-48 bg-blue-500 text-white p-4 rounded">
                    Contenido que sobresale
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="overflow-visible w-32 h-32"&gt;
  &lt;div class="w-48 h-48"&gt;Contenido grande&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
