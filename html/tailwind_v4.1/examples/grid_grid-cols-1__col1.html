<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Columnas - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid Columnas</h1>
        <p class="text-gray-600 mb-8">Control del número de columnas en CSS Grid</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">1 Columna</h2>
            <div class="grid grid-cols-1 gap-4">
                <div class="bg-blue-500 text-white p-6 rounded text-center">Item 1</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">Item 2</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">2 Columnas</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-green-500 text-white p-6 rounded text-center">1</div>
                <div class="bg-green-500 text-white p-6 rounded text-center">2</div>
                <div class="bg-green-500 text-white p-6 rounded text-center">3</div>
                <div class="bg-green-500 text-white p-6 rounded text-center">4</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">4 Columnas</h2>
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-red-500 text-white p-4 rounded text-center">1</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">2</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">3</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">4</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">5</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">6</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">7</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">8</div>
            </div>
        </div>
    </div>
</body>
</html>
