<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Translate - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Transform - Translate</h1>
        <p class="text-gray-600 mb-8">Mover elementos en X e Y</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="flex gap-4">
                <div class="w-20 h-20 bg-red-500 rounded"></div>
                <div class="w-20 h-20 bg-red-500 rounded translate-x-4"></div>
                <div class="w-20 h-20 bg-red-500 rounded translate-y-4"></div>
            </div>
            <div class="flex gap-4">
                <div class="w-20 h-20 bg-purple-500 rounded"></div>
                <div class="w-20 h-20 bg-purple-500 rounded translate-x-8 translate-y-8"></div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="translate-x-4 translate-y-4"&gt;
  Elemento movido
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
