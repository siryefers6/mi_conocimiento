<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height Screen - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Height - Screen (100vh)</h1>
        <p class="text-gray-600 mb-8">Alto del viewport completo</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <p class="text-sm text-gray-500 mb-2">El elemento h-screen ocupa toda la altura visible de la pantalla</p>
            <div class="h-64 bg-blue-500 text-white rounded flex items-center justify-center">
                h-screen (100vh)
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="h-screen"&gt;
  100% alto de pantalla
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
