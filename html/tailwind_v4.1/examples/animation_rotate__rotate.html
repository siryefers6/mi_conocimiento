<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Rotate - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Transform - Rotate</h1>
        <p class="text-gray-600 mb-8">Rotar elementos</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex gap-4">
            <div class="w-24 h-24 bg-green-500 rounded rotate-0 flex items-center justify-center text-white">0°</div>
            <div class="w-24 h-24 bg-green-500 rounded rotate-45 flex items-center justify-center text-white">45°</div>
            <div class="w-24 h-24 bg-green-500 rounded rotate-90 flex items-center justify-center text-white">90°</div>
            <div class="w-24 h-24 bg-green-500 rounded rotate-180 flex items-center justify-center text-white">180°</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="rotate-45"&gt;
  Elemento rotado
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
