<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Brightness - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Filter - Brightness</h1>
        <p class="text-gray-600 mb-8">Ajustar brillo</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex gap-4">
            <img src="https://via.placeholder.com/100" alt="Original" class="rounded">
            <img src="https://via.placeholder.com/100" alt="Darker" class="rounded brightness-75">
            <img src="https://via.placeholder.com/100" alt="Brighter" class="rounded brightness-125">
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;img class="brightness-75"&gt;
  Ajuste de brillo
&lt;/img&gt;</code></pre>
        </div>
    </div>
</body>
</html>
