<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus State - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Estados - Focus</h1>
        <p class="text-gray-600 mb-8">Cambios cuando el elemento tiene focus</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <input type="text" placeholder="Haz clic aquí" class="w-full border-2 border-gray-300 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 p-2 rounded transition">
            <button class="bg-blue-500 hover:bg-blue-600 focus:ring-2 focus:ring-blue-300 text-white px-6 py-2 rounded transition">
                Enfocable
            </button>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;input class="focus:border-blue-500 focus:ring-2"&gt;
  Estados de focus
&lt;/input&gt;</code></pre>
        </div>
    </div>
</body>
</html>
