<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Align Left - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Text Align - Left (Izquierda)</h1>
        <p class="text-gray-600 mb-8">Alineación a la izquierda</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="text-left bg-gray-100 p-4 border-l-4 border-blue-500">
                Este texto está alineado a la izquierda. Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="text-left"&gt;
  Texto alineado izquierda
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
