<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppercase - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Text Transform - Uppercase</h1>
        <p class="text-gray-600 mb-8">Todo en mayúsculas</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="uppercase">Este texto está en mayúsculas</p>
            <p class="lowercase">ESTE TEXTO ESTÁ EN MINÚSCULAS</p>
            <p class="capitalize">este texto tiene cada palabra capitalizada</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="uppercase"&gt;
  Texto en mayúsculas
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
