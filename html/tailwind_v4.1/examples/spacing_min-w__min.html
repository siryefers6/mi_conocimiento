<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Width - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Min Width - Ancho Mínimo</h1>
        <p class="text-gray-600 mb-8">Ancho mínimo que debe tener un elemento</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="min-w-32 bg-blue-500 text-white p-4 rounded">min-w-32 (mínimo 8rem)</div>
            <div class="min-w-48 bg-green-500 text-white p-4 rounded">min-w-48 (mínimo 12rem)</div>
            <div class="min-w-64 bg-red-500 text-white p-4 rounded">min-w-64 (mínimo 16rem)</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="min-w-48"&gt;
  Ancho mínimo de 12rem
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
