<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Left - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Position - left-0</h1>
        <p class="text-gray-600 mb-8">Posiciona elemento en el lado izquierdo</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="relative bg-gray-100 p-4 rounded h-32">
                <div class="absolute left-0 top-4 bg-purple-500 text-white px-3 py-1 rounded">left-0</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="relative"&gt;
  &lt;div class="absolute left-0"&gt;Contenido&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
