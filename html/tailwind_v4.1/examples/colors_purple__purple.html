<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Purple - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Palette - Purple</h1>
        <p class="text-gray-600 mb-8">Paleta completa de colores púrpura</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-purple-50 p-4 rounded border border-gray-200">purple-50</div>
                <div class="bg-purple-100 p-4 rounded border border-gray-200">purple-100</div>
                <div class="bg-purple-300 p-4 rounded border border-gray-200 text-white">purple-300</div>
                <div class="bg-purple-500 p-4 rounded border border-gray-200 text-white">purple-500</div>
                <div class="bg-purple-700 p-4 rounded border border-gray-200 text-white">purple-700</div>
                <div class="bg-purple-900 p-4 rounded border border-gray-200 text-white">purple-900</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-purple-500"&gt;
  Fondo púrpura
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
