<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Between, Around, Evenly - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Justify - Espaciado</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">justify-between - Espacio Uniforme</h2>
            <div class="flex justify-between gap-4 bg-gray-100 p-4 rounded">
                <div class="bg-blue-500 text-white px-4 py-2 rounded">Uno</div>
                <div class="bg-blue-500 text-white px-4 py-2 rounded">Dos</div>
                <div class="bg-blue-500 text-white px-4 py-2 rounded">Tres</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">justify-around - Espacio Alrededor</h2>
            <div class="flex justify-around gap-4 bg-gray-100 p-4 rounded">
                <div class="bg-green-500 text-white px-4 py-2 rounded">Uno</div>
                <div class="bg-green-500 text-white px-4 py-2 rounded">Dos</div>
                <div class="bg-green-500 text-white px-4 py-2 rounded">Tres</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">justify-evenly - Espacio Igual</h2>
            <div class="flex justify-evenly gap-4 bg-gray-100 p-4 rounded">
                <div class="bg-red-500 text-white px-4 py-2 rounded">Uno</div>
                <div class="bg-red-500 text-white px-4 py-2 rounded">Dos</div>
                <div class="bg-red-500 text-white px-4 py-2 rounded">Tres</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <h2 class="text-lg font-semibold mb-2">Código HTML</h2>
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex justify-between"&gt;
    &lt;div&gt;Extremos&lt;/div&gt;
    &lt;div&gt;Extremos&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
