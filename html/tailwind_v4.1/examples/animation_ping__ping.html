<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Animation - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Animation - Ping</h1>
        <p class="text-gray-600 mb-8">Onda de radar/ping</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex gap-8">
            <div class="relative w-20 h-20">
                <div class="absolute inset-0 bg-red-500 rounded-full animate-ping"></div>
                <div class="absolute inset-0 bg-red-500 rounded-full opacity-75"></div>
            </div>
            <div class="relative w-20 h-20">
                <div class="absolute inset-0 bg-blue-500 rounded-full animate-ping"></div>
                <div class="absolute inset-0 bg-blue-500 rounded-full opacity-75"></div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="animate-ping"&gt;
  Animación de ping
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
