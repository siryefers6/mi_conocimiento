<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Scale - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Transform - Scale</h1>
        <p class="text-gray-600 mb-8">Escalar elementos</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex gap-4">
            <div class="w-24 h-24 bg-blue-500 rounded scale-75"></div>
            <div class="w-24 h-24 bg-blue-500 rounded scale-100"></div>
            <div class="w-24 h-24 bg-blue-500 rounded scale-125"></div>
            <div class="w-24 h-24 bg-blue-500 rounded scale-150"></div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="scale-125"&gt;
  Elemento escalado
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
