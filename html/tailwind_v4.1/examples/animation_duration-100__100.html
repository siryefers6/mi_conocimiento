<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duration 100 - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Animation - Duration 100ms</h1>
        <p class="text-gray-600 mb-8">Duración muy rápida de la animación</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <button onclick="this.classList.toggle('scale-110')" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded transition duration-100">
                Clic para animar
            </button>
            <div class="w-24 h-24 bg-green-500 rounded mt-4 transition duration-100 hover:scale-125"></div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="transition duration-100"&gt;
  Transición muy rápida
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
