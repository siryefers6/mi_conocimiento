<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspect Ratio - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Aspect Ratio</h1>
        <p class="text-gray-600 mb-8">Mantener relación de aspecto en contenedores</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="aspect-video bg-blue-500 rounded flex items-center justify-center text-white">
                aspect-video (16:9)
            </div>
            <div class="aspect-square bg-green-500 rounded flex items-center justify-center text-white">
                aspect-square (1:1)
            </div>
            <div class="w-64 aspect-[4/3] bg-red-500 rounded flex items-center justify-center text-white">
                aspect-[4/3]
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="aspect-video"&gt;
  Relación de aspecto
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
