<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Negativo - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Margin - Negativo (-m-*)</h1>
        <p class="text-gray-600 mb-8">Margen negativo para solapamiento</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="relative h-40">
                <div class="bg-blue-500 text-white p-4 rounded w-32 absolute">
                    Elemento 1
                </div>
                <div class="bg-red-500 text-white p-4 rounded w-32 absolute -mt-4 left-20 top-20">
                    Elemento 2 (-mt-4)
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="-mt-4"&gt;
  Margen negativo arriba
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
