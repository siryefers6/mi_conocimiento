<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-2">Formularios</h1>
        <p class="text-gray-600 mb-8">Ejemplos de formularios con Tailwind CSS</p>
        
        <div class="bg-white rounded-lg shadow p-8">
            <h2 class="text-2xl font-bold mb-6">Formulario de Contacto</h2>
            
            <form class="space-y-6">
                <!-- Nombre -->
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre
                    </label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre"
                        placeholder="Tu nombre"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="tu@email.com"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                </div>

                <!-- Teléfono -->
                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-2">
                        Teléfono
                    </label>
                    <input 
                        type="tel" 
                        id="telefono" 
                        name="telefono"
                        placeholder="+34 123 456 789"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                </div>

                <!-- Asunto -->
                <div>
                    <label for="asunto" class="block text-sm font-medium text-gray-700 mb-2">
                        Asunto
                    </label>
                    <select 
                        id="asunto" 
                        name="asunto"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option>Selecciona un asunto</option>
                        <option>Consulta</option>
                        <option>Soporte</option>
                        <option>Ventas</option>
                        <option>Otro</option>
                    </select>
                </div>

                <!-- Mensaje -->
                <div>
                    <label for="mensaje" class="block text-sm font-medium text-gray-700 mb-2">
                        Mensaje
                    </label>
                    <textarea 
                        id="mensaje" 
                        name="mensaje"
                        rows="5"
                        placeholder="Cuéntanos más..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                    ></textarea>
                </div>

                <!-- Checkbox -->
                <div class="flex items-center">
                    <input 
                        type="checkbox" 
                        id="terminos" 
                        name="terminos"
                        class="h-4 w-4 text-blue-500 rounded border-gray-300 focus:ring-blue-500"
                    >
                    <label for="terminos" class="ml-2 text-sm text-gray-700">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <!-- Botones -->
                <div class="flex gap-4 pt-4">
                    <button 
                        type="submit"
                        class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition"
                    >
                        Enviar
                    </button>
                    <button 
                        type="reset"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg transition"
                    >
                        Limpiar
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mt-8">
            <h2 class="text-xl font-bold mb-4">Elementos de Formulario</h2>
            
            <div class="space-y-6">
                <!-- Input estados -->
                <div>
                    <h3 class="font-semibold mb-3">Estados del Input</h3>
                    <input type="text" placeholder="Normal" class="w-full mb-2 px-4 py-2 border border-gray-300 rounded-lg">
                    <input type="text" placeholder="Focus" class="w-full mb-2 px-4 py-2 border border-blue-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" placeholder="Error" class="w-full px-4 py-2 border border-red-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <!-- Botones -->
                <div>
                    <h3 class="font-semibold mb-3">Estados del Botón</h3>
                    <div class="space-y-2">
                        <button class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">Normal</button>
                        <button disabled class="w-full bg-gray-400 text-gray-600 py-2 rounded cursor-not-allowed">Deshabilitado</button>
                        <button class="w-full border-2 border-blue-500 text-blue-500 hover:bg-blue-50 py-2 rounded">Secundario</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
