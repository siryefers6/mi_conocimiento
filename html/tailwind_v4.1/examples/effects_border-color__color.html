<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Color - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Border - Color</h1>
        <p class="text-gray-600 mb-8">Color del borde personalizado</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="border-2 border-red-500 p-4 rounded">Borde rojo</div>
            <div class="border-2 border-blue-500 p-4 rounded">Borde azul</div>
            <div class="border-2 border-green-500 p-4 rounded">Borde verde</div>
            <div class="border-2 border-purple-500 p-4 rounded">Borde púrpura</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="border-2 border-blue-500"&gt;
  Borde de color azul
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
