<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width Screen - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Width - Screen (100vw)</h1>
        <p class="text-gray-600 mb-8">Ancho del viewport</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <p class="text-sm text-gray-500 mb-2">El elemento w-screen se extiende a todo el ancho de la pantalla</p>
            <div class="relative ml-(-2rem)">
                <div class="w-screen bg-blue-500 text-white p-4">
                    w-screen (100% viewport)
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-screen"&gt;
  Ancho completo de pantalla
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
