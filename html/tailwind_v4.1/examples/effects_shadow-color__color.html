<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Color - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Shadow - Con Color</h1>
        <p class="text-gray-600 mb-8">Sombra con color personalizado</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="bg-white shadow-lg p-4 rounded" style="box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);">Sombra azul</div>
            <div class="bg-white shadow-lg p-4 rounded" style="box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.5);">Sombra roja</div>
            <div class="bg-white shadow-lg p-4 rounded" style="box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.5);">Sombra verde</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div style="box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5)"&gt;
  Sombra con color
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
