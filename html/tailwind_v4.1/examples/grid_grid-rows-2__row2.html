<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Rows - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid Rows</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">2 Filas</h2>
            <div class="grid grid-cols-3 grid-rows-2 gap-4 h-64">
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">1</div>
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">2</div>
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">3</div>
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">4</div>
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">5</div>
                <div class="bg-blue-500 text-white rounded flex items-center justify-center">6</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">3 Filas</h2>
            <div class="grid grid-cols-2 grid-rows-3 gap-4 h-80">
                <div class="bg-green-500 text-white rounded flex items-center justify-center">1</div>
                <div class="bg-green-500 text-white rounded flex items-center justify-center">2</div>
                <div class="bg-green-500 text-white rounded flex items-center justify-center">3</div>
                <div class="bg-green-500 text-white rounded flex items-center justify-center">4</div>
                <div class="bg-green-500 text-white rounded flex items-center justify-center">5</div>
                <div class="bg-green-500 text-white rounded flex items-center justify-center">6</div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">4 Filas</h2>
            <div class="grid grid-cols-2 grid-rows-4 gap-4 h-96">
                <div class="bg-red-500 text-white rounded flex items-center justify-center">1</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">2</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">3</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">4</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">5</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">6</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">7</div>
                <div class="bg-red-500 text-white rounded flex items-center justify-center">8</div>
            </div>
        </div>
    </div>
</body>
</html>
