<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 2 Columnas - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid 2 Columnas</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-500 text-white p-6 rounded text-center">1</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">2</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">3</div>
                <div class="bg-blue-500 text-white p-6 rounded text-center">4</div>
            </div>
        </div>
    </div>
</body>
</html>
