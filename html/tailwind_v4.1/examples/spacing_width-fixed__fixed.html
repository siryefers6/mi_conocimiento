<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width Fixed - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Width - Fixed Values</h1>
        <p class="text-gray-600 mb-8">Anchos específicos con valores fijos</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="w-64 bg-blue-500 text-white p-4 rounded">w-64 (16rem)</div>
            <div class="w-80 bg-green-500 text-white p-4 rounded">w-80 (20rem)</div>
            <div class="w-96 bg-red-500 text-white p-4 rounded">w-96 (24rem)</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-96"&gt;
  Ancho fijo de 24rem
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
