<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounded Full - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Border Radius - Rounded Full</h1>
        <p class="text-gray-600 mb-8">Completamente redondeado (círculo)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex gap-4">
            <div class="w-24 h-24 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">Full</div>
            <div class="w-32 h-16 bg-green-500 rounded-full flex items-center justify-center text-white font-bold">Rounded Full</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="rounded-full"&gt;
  Completamente redondeado
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
