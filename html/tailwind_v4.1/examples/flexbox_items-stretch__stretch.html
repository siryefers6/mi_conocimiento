<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Stretch - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Items Stretch</h1>
        <p class="text-gray-600 mb-8">Estira los elementos para llenar el espacio disponible</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex items-stretch gap-4 bg-gray-100 p-4 rounded h-32">
                <div class="flex-1 bg-blue-500 text-white rounded flex items-center justify-center">Estirado</div>
                <div class="flex-1 bg-green-500 text-white rounded flex items-center justify-center">Estirado</div>
                <div class="flex-1 bg-red-500 text-white rounded flex items-center justify-center">Estirado</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex items-stretch h-32"&gt;
    &lt;div class="flex-1"&gt;Estirado&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
