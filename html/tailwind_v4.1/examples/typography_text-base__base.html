<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Size Base - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Text - Size Base (text-base)</h1>
        <p class="text-gray-600 mb-8">Tamaño base 1rem (16px)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="text-base">Este texto es text-base (tamaño predeterminado)</p>
            <p class="text-sm">Este es text-sm para comparación</p>
            <p class="text-lg">Este es text-lg para comparación</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="text-base"&gt;
  Texto base
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
