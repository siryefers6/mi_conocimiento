<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Justify Items Center - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid Justify Items Center</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-3 gap-4 justify-items-center bg-gray-100 p-4 rounded">
                <div class="bg-blue-500 text-white px-6 py-3 rounded">Item 1</div>
                <div class="bg-blue-500 text-white px-6 py-3 rounded">Item 2</div>
                <div class="bg-blue-500 text-white px-6 py-3 rounded">Item 3</div>
            </div>
        </div>
    </div>
</body>
</html>
