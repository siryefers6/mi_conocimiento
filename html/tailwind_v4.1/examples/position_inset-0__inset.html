<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Inset - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Position - inset-0</h1>
        <p class="text-gray-600 mb-8">Posiciona elemento en todos los lados (top, right, bottom, left)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="relative bg-gray-100 p-4 rounded h-32">
                <div class="absolute inset-0 bg-orange-500 text-white rounded flex items-center justify-center">
                    inset-0 (todos lados)
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="relative"&gt;
  &lt;div class="absolute inset-0"&gt;Contenido&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
