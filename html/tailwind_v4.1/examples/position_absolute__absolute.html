<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Absolute - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Position Absolute</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="relative bg-gray-100 p-4 rounded h-40">
                <div class="absolute inset-0 bg-blue-500 opacity-10 rounded"></div>
                <div class="absolute top-4 left-4 bg-red-500 text-white px-3 py-1 rounded">Top Left</div>
                <div class="absolute top-4 right-4 bg-red-500 text-white px-3 py-1 rounded">Top Right</div>
                <div class="absolute bottom-4 left-4 bg-red-500 text-white px-3 py-1 rounded">Bottom Left</div>
                <div class="absolute bottom-4 right-4 bg-red-500 text-white px-3 py-1 rounded">Bottom Right</div>
            </div>
        </div>
    </div>
</body>
</html>
