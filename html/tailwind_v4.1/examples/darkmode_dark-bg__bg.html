<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Background - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white dark:bg-gray-900 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-900 dark:text-white">Fondo en Modo Oscuro</h1>
        <p class="text-gray-600 dark:text-gray-300 mb-8">Colores de fondo adaptables</p>
        
        <button onclick="document.documentElement.classList.toggle('dark')" class="bg-blue-500 text-white px-6 py-2 rounded mb-6">
            Toggle Modo Oscuro
        </button>

        <div class="space-y-4">
            <div class="bg-blue-50 dark:bg-blue-900 p-4 rounded">
                <p class="text-blue-900 dark:text-blue-100">Fondo azul adaptable</p>
            </div>
            <div class="bg-green-50 dark:bg-green-900 p-4 rounded">
                <p class="text-green-900 dark:text-green-100">Fondo verde adaptable</p>
            </div>
            <div class="bg-red-50 dark:bg-red-900 p-4 rounded">
                <p class="text-red-900 dark:text-red-100">Fondo rojo adaptable</p>
            </div>
        </div>

        <div class="bg-gray-100 dark:bg-gray-700 rounded-lg p-6 mt-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-blue-50 dark:bg-blue-900"&gt;
  Fondo adaptable
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
