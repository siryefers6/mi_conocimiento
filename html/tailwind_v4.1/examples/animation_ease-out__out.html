<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease Out - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Animation - Easing Out</h1>
        <p class="text-gray-600 mb-8">Empieza rápido, desacelera</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 flex flex-col gap-4">
            <div class="h-20 bg-red-500 rounded transition ease-out duration-1000 hover:translate-x-32"></div>
            <p class="text-sm text-gray-600">ease-out</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="ease-out"&gt;
  Animación desacelerada
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
