<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive XL - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Responsive - Breakpoint XL</h1>
        <p class="text-gray-600 mb-8">Punto de quiebre extra grande (1280px)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="w-full xl:w-4/5 bg-blue-500 text-white p-4 rounded">
                4/5 del ancho en XL+
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-5 gap-4 mt-4">
                <div class="bg-green-500 text-white p-4 rounded">1</div>
                <div class="bg-purple-500 text-white p-4 rounded">2</div>
                <div class="bg-red-500 text-white p-4 rounded">3</div>
                <div class="bg-yellow-500 text-white p-4 rounded">4</div>
                <div class="bg-pink-500 text-white p-4 rounded">5</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-full xl:w-4/5"&gt;
  Responsivo en punto XL
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
