<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Size Small - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Text - Size Small (text-sm)</h1>
        <p class="text-gray-600 mb-8">Tamaño pequeño 0.875rem (14px)</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <p class="text-sm">Este texto es text-sm</p>
            <p class="text-xs">Este es text-xs para comparación</p>
            <p class="text-base">Este es text-base para comparación</p>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;p class="text-sm"&gt;
  Texto pequeño
&lt;/p&gt;</code></pre>
        </div>
    </div>
</body>
</html>
