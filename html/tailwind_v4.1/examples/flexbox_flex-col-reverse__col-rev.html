<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Col Reverse - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Flex Col Reverse</h1>
        <p class="text-gray-600 mb-8">Invierte el orden de los elementos en vertical</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Ejemplo</h2>
            
            <div class="flex flex-col-reverse gap-3">
                <div class="bg-blue-500 text-white p-4 rounded text-center">Primero (abajo)</div>
                <div class="bg-green-500 text-white p-4 rounded text-center">Segundo</div>
                <div class="bg-red-500 text-white p-4 rounded text-center">Tercero (arriba)</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <h2 class="text-lg font-semibold mb-2">Código HTML</h2>
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex flex-col-reverse"&gt;
    &lt;div&gt;Primero&lt;/div&gt;
    &lt;div&gt;Segundo&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
