<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index 10 - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Z-Index - 10</h1>
        <p class="text-gray-600 mb-8">Apilamiento con z-index: 10</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="relative h-32">
                <div class="absolute z-0 top-0 left-0 bg-blue-500 text-white p-4 rounded w-32">
                    z-0
                </div>
                <div class="absolute z-10 top-4 left-8 bg-red-500 text-white p-4 rounded w-32">
                    z-10
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="absolute z-10"&gt;
  Elemento elevado
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
