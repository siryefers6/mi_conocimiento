<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Sticky - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Position Sticky</h1>
        <p class="text-gray-600 mb-8">Elemento que se pega al scroll</p>
        
        <div class="bg-white rounded-lg shadow p-6 h-64 overflow-y-auto">
            <div class="sticky top-0 bg-green-500 text-white px-4 py-2 rounded mb-4 font-semibold">
                Header Pegajoso (Sticky)
            </div>
            <div class="space-y-3">
                <p>Elemento 1</p>
                <p>Elemento 2</p>
                <p>Elemento 3</p>
                <p>Elemento 4</p>
                <p>Elemento 5</p>
                <p>Elemento 6</p>
                <p>Elemento 7</p>
                <p>Elemento 8</p>
                <p>Elemento 9</p>
                <p>Elemento 10</p>
            </div>
        </div>
    </div>
</body>
</html>
