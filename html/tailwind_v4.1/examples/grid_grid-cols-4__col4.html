<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Columns 4 - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid - 4 Columnas</h1>
        <p class="text-gray-600 mb-8">Distribuye contenido en 4 columnas iguales</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-4 gap-4">
                <div class="bg-blue-500 text-white p-4 rounded text-center">1</div>
                <div class="bg-blue-500 text-white p-4 rounded text-center">2</div>
                <div class="bg-blue-500 text-white p-4 rounded text-center">3</div>
                <div class="bg-blue-500 text-white p-4 rounded text-center">4</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="grid grid-cols-4 gap-4"&gt;
  &lt;div&gt;1&lt;/div&gt;
  &lt;div&gt;2&lt;/div&gt;
  &lt;div&gt;3&lt;/div&gt;
  &lt;div&gt;4&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
