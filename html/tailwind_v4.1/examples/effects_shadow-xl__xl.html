<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow XL - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Shadow - Extra Large</h1>
        <p class="text-gray-600 mb-8">Sombra muy grande y pronunciada</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="bg-white shadow-lg p-4 rounded">shadow-lg</div>
            <div class="bg-white shadow-xl p-4 rounded">shadow-xl</div>
            <div class="bg-white shadow-2xl p-4 rounded">shadow-2xl</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="shadow-xl"&gt;
  Sombra muy grande
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
