<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Inline - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Display Inline</h1>
        <p class="text-gray-600 mb-8">Convierte un elemento en inline (solo ocupa el espacio necesario)</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Ejemplo</h2>
            
            <div>
                <span class="inline bg-blue-500 text-white px-3 py-1 rounded mr-2">
                    Elemento 1
                </span>
                <span class="inline bg-green-500 text-white px-3 py-1 rounded mr-2">
                    Elemento 2
                </span>
                <span class="inline bg-red-500 text-white px-3 py-1 rounded">
                    Elemento 3
                </span>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <h2 class="text-lg font-semibold mb-2">Código HTML</h2>
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;span class="inline bg-blue-500"&gt;
    Elemento en línea
&lt;/span&gt;</code></pre>
        </div>
    </div>
</body>
</html>
