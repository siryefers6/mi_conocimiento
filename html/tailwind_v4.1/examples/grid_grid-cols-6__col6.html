<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid 6 Columnas - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Grid 6 Columnas</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="grid grid-cols-6 gap-2">
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">1</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">2</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">3</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">4</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">5</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">6</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">7</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">8</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">9</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">10</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">11</div>
                <div class="bg-green-500 text-white p-4 rounded text-center text-sm font-semibold">12</div>
            </div>
        </div>
    </div>
</body>
</html>
