<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Orange - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Palette - Orange</h1>
        <p class="text-gray-600 mb-8">Paleta completa de colores naranjas</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-orange-50 p-4 rounded border border-gray-200">orange-50</div>
                <div class="bg-orange-100 p-4 rounded border border-gray-200">orange-100</div>
                <div class="bg-orange-300 p-4 rounded border border-gray-200 text-white">orange-300</div>
                <div class="bg-orange-500 p-4 rounded border border-gray-200 text-white">orange-500</div>
                <div class="bg-orange-700 p-4 rounded border border-gray-200 text-white">orange-700</div>
                <div class="bg-orange-900 p-4 rounded border border-gray-200 text-white">orange-900</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-orange-500"&gt;
  Fondo naranja
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
