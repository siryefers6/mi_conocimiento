<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors Indigo - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Palette - Indigo</h1>
        <p class="text-gray-600 mb-8">Paleta completa de colores índigo</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-indigo-50 p-4 rounded border border-gray-200">indigo-50</div>
                <div class="bg-indigo-100 p-4 rounded border border-gray-200">indigo-100</div>
                <div class="bg-indigo-300 p-4 rounded border border-gray-200 text-white">indigo-300</div>
                <div class="bg-indigo-500 p-4 rounded border border-gray-200 text-white">indigo-500</div>
                <div class="bg-indigo-700 p-4 rounded border border-gray-200 text-white">indigo-700</div>
                <div class="bg-indigo-900 p-4 rounded border border-gray-200 text-white">indigo-900</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="bg-indigo-500"&gt;
  Fondo índigo
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
