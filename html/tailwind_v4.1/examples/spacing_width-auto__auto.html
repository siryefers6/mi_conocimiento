<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width Auto - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Width - Auto</h1>
        <p class="text-gray-600 mb-8">Ancho automático según contenido</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="border-2 border-gray-300 p-4">
                <div class="w-auto bg-blue-500 text-white p-4 rounded inline-block">
                    w-auto (ancho del contenido)
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="w-auto"&gt;
  Ancho automático
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
