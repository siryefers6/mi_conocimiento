<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Width - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Max Width - Ancho Máximo</h1>
        <p class="text-gray-600 mb-8">Ancho máximo que puede tener un elemento</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6 space-y-4">
            <div class="max-w-xs bg-blue-500 text-white p-4 rounded">max-w-xs (máximo 20rem)</div>
            <div class="max-w-sm bg-green-500 text-white p-4 rounded">max-w-sm (máximo 24rem)</div>
            <div class="max-w-md bg-red-500 text-white p-4 rounded">max-w-md (máximo 28rem)</div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="max-w-md"&gt;
  Ancho máximo de 28rem
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
