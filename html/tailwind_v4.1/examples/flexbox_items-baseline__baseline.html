<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Baseline - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Items Baseline</h1>
        <p class="text-gray-600 mb-8">Alinea elementos en su línea base de texto</p>
        
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex items-baseline gap-4 bg-gray-100 p-8 rounded">
                <div class="bg-blue-500 text-white text-sm px-4 py-2 rounded">Pequeño</div>
                <div class="bg-blue-500 text-white text-base px-4 py-2 rounded">Normal</div>
                <div class="bg-blue-500 text-white text-2xl px-4 py-2 rounded">Grande</div>
                <div class="bg-blue-500 text-white text-4xl px-4 py-2 rounded">Enorme</div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6 mt-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="flex items-baseline"&gt;
    &lt;div class="text-sm"&gt;Pequeño&lt;/div&gt;
    &lt;div class="text-2xl"&gt;Grande&lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
