<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overflow X Auto - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Overflow - X Auto</h1>
        <p class="text-gray-600 mb-8">Scroll horizontal automático</p>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="overflow-x-auto w-full bg-gray-100 border-2 border-gray-300 rounded p-2">
                <div class="flex gap-2 w-max">
                    <div class="bg-blue-500 text-white p-4 rounded w-32 flex-shrink-0">Item 1</div>
                    <div class="bg-green-500 text-white p-4 rounded w-32 flex-shrink-0">Item 2</div>
                    <div class="bg-red-500 text-white p-4 rounded w-32 flex-shrink-0">Item 3</div>
                    <div class="bg-purple-500 text-white p-4 rounded w-32 flex-shrink-0">Item 4</div>
                </div>
            </div>
        </div>

        <div class="bg-gray-100 rounded-lg p-6">
            <pre class="bg-gray-900 text-green-400 p-4 rounded overflow-x-auto"><code>&lt;div class="overflow-x-auto"&gt;
  &lt;div class="flex w-max"&gt;
    &lt;div&gt;Item 1&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;</code></pre>
        </div>
    </div>
</body>
</html>
